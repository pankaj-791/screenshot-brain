name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Use the fixed debug signing key
        run: |
          mkdir -p ~/.android
          tr -d ' \r\n' < ci/debug.keystore.txt | base64 -d > ~/.android/debug.keystore
          echo "f6819fb3264369fc72ec1223fb54b778798e1dd7cf5f208eda475f24bd070dc3  $HOME/.android/debug.keystore" | sha256sum -c -

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check the APK is signed with the fixed key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "WARNING: apksigner not found, could not check the signing key."
            exit 0
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signer.txt
          if grep -qi "SHA-256 digest: 3a982a24525bbba0194523d337701b0e78fd1636860271c17da5860f5268a5fa" signer.txt; then
            echo "SIGNING KEY OK"
          else
            echo "WRONG SIGNING KEY: this APK will not update over other builds."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-brain-debug
          path: app/build/outputs/apk/debug/app-debug.apk
